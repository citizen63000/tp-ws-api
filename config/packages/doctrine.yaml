doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '10.3'
        options:
            1001: true #load local infile
        schema_filter: ~
        # Si tu utilises un schéma spécifique :
        default_table_options:
            schema: "api"
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
