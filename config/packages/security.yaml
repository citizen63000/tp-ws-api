security:
    erase_credentials: false
    enable_authenticator_manager: true
    password_hashers:
        App\Entity\User\User:
            algorithm: bcrypt
            cost: 15
        default:
            algorithm: bcrypt
            cost: 15
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        users_in_memory: { memory: null }
        # https://symfony.com/doc/current/security.html#b-configuring-how-users-are-loaded
        app_user_provider:
            entity:
                class: App\Entity\User\User
                property: username
    firewalls:
        login:
            pattern: ^/authenticate
            provider: app_user_provider
            stateless: true
            json_login:
                check_path: /authenticate
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        #            refresh_jwt:
        #                check_path: /api/token/refresh # or, you may use the `api_refresh_token` route name

        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
        api-doc:
            pattern: ^/api-doc
            security: false

        i18n-texts:
            pattern: ^/i18n/texts
            methods: [GET]
            security: false

        token-refresh:
            pattern:  ^/token/refresh
            stateless: true
            security: false

        reset-password:
            pattern:  ^/reset-password
            stateless: true
            security: false

        update-password:
            pattern:  ^/update-password
            security: false

        api:
            pattern:   ^/
            provider: app_user_provider
            stateless: true
#            custom_authenticators:
#                    - lexik_jwt_authentication.jwt_token_authenticator
#                    - lexik_jwt_authentication.jwt_manager
    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/$,                                      roles: IS_AUTHENTICATED_ANONYMOUSLY, requires_channel: 'https'  }
        - { path: ^/(_(profiler|wdt)|css|images|js)/,       roles: IS_AUTHENTICATED_ANONYMOUSLY, requires_channel: 'https'  }
        - { path: ^/api-doc,                                roles: IS_AUTHENTICATED_ANONYMOUSLY   }
        - { path: '^/token/refresh',                        roles: IS_AUTHENTICATED_ANONYMOUSLY   }
        - { path: '^/reset-password',                       roles: IS_AUTHENTICATED_ANONYMOUSLY   }
        - { path: '^/authenticate',                         roles: IS_AUTHENTICATED_ANONYMOUSLY   }
        - { path: ^/,                                       roles: ROLE_USER                  }
